<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ludo Kingdom</title>

    <!-- CSS FILE LINK -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>👑 LUDO KINGDOM</h1>
        <p class="subtitle">The Kingdom of Ludo Begins!</p>
    </header>

    <div class="container">

        <div class="board">

            <div class="home red">🔴 RED</div>
            <div class="center">⭐</div>
            <div class="home green">🟢 GREEN</div>

            <div class="center">🎲</div>
            <div class="center">👑</div>
            <div class="center">🎲</div>

            <div class="home yellow">🟡 YELLOW</div>
            <div class="center">⭐</div>
            <div class="home blue">🔵 BLUE</div>

        </div>

        <h2>Roll The Dice</h2>

        <div id="dice">🎲</div>

        <button onclick="rollDice()">ROLL DICE</button>

        <div id="status">Welcome to Ludo Kingdom!</div>

        <div id="turn">Next Turn: 🔴 Red Player</div>

    </div>

    <!-- JAVASCRIPT FILE LINK -->
    <script src="app.js"></script>

</body>
</html>
