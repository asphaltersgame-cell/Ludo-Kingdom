<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Kingdom</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #10152d, #25245a);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 25px 10px;
}

h1 {
  color: #ffd447;
  font-size: 34px;
  margin-bottom: 5px;
}

.subtitle {
  color: #c7c9e8;
}

.container {
  max-width: 440px;
  margin: auto;
  padding: 15px;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  background: white;
  padding: 7px;
  border-radius: 15px;
}

.home {
  height: 115px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  font-weight: bold;
}

.red { background: #ed3434; }
.green { background: #20b76b; }
.yellow { background: #f6cb37; color: #222; }
.blue { background: #2879ed; }

.center {
  background: #f3f3f3;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-size: 24px;
  font-weight: bold;
}

button {
  background: #ffd447;
  color: #17172d;
  border: none;
  padding: 15px 25px;
  margin: 12px 5px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#dice {
  font-size: 55px;
  margin: 10px;
}

#status {
  font-size: 19px;
  color: #ffd447;
  margin: 15px;
}
</style>
</head>

<body>

<header>
<h1>👑 LUDO KINGDOM</h1>
<p class="subtitle">The Kingdom of Ludo Begins!</p>
</header>

<div class="container">

<div class="board">
<div class="home red">🔴 RED</div>
<div class="center">⭐</div>
<div class="home green">🟢 GREEN</div>

<div class="center">🎲</div>
<div class="center">👑</div>
<div class="center">🎲</div>

<div class="home yellow">🟡 YELLOW</div>
<div class="center">⭐</div>
<div class="home blue">🔵 BLUE</div>
</div>

<h2>Roll The Dice</h2>

<div id="dice">🎲</div>

<button onclick="rollDice()">ROLL DICE</button>

<div id="status">Welcome to Ludo Kingdom!</div>

</div>

<script>
function rollDice() {
  let number = Math.floor(Math.random() * 6) + 1;

  const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];

  document.getElementById("dice").textContent =
    diceFaces[number - 1];

  document.getElementById("status").textContent =
    "You rolled " + number + "!";
}
</script>

</body>
  </html>
