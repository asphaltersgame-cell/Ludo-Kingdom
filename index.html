<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Kingdom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="game-header">
        <h1>👑 LUDO KINGDOM</h1>
    </header>

    <main class="game-container">

        <div class="player-layout">

            <div class="player-card red-card" id="player-red">
                <div class="player-name">🔴 Red Player</div>
                <div class="dice-holder" id="dice-holder-red"></div>
            </div>

            <div class="player-card green-card" id="player-green">
                <div class="player-name">🟢 Green Player</div>
                <div class="dice-holder" id="dice-holder-green"></div>
            </div>

            <div class="board-container">
                <div id="board" class="board"></div>
            </div>

            <div class="player-card blue-card" id="player-blue">
                <div class="player-name">🔵 Blue Player</div>
                <div class="dice-holder" id="dice-holder-blue"></div>
            </div>

            <div class="player-card yellow-card" id="player-yellow">
                <div class="player-name">🟡 Yellow Player</div>
                <div class="dice-holder" id="dice-holder-yellow"></div>
            </div>

        </div>

        <div class="game-controls">
            <div id="dice">🎲</div>

            <button id="rollButton" onclick="rollDice()">
                ROLL DICE
            </button>

            <p id="status">Red Player's Turn</p>
            <p id="turn">Roll the dice to play</p>
        </div>

        <div class="game-rules">
            <p>Each player has 4 tokens.</p>
            <p>Roll a 6 to start your token.</p>
            <p>Reach the center to win!</p>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
